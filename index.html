<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ascensor</title>
</head>
<body>
  <h1 align="center">Simulador De Ascensor</h1>

  <p id="info"></p>

  <div>
    <label>Velocidad de subida: <input type="range" id="velocidad" min="1" max="10"></label>
  </div>
  <div>
    <label>Tiempo de espera: <input type="range" id="espera" min="0" max="5"></label>
  </div>

  <ul id="pisos">
    <li id="piso-12">Piso 12 <span class="marcador"></span> <button type="button" data-piso="12">Llamar</button></li>
    <li id="piso-11">Piso 11 <span class="marcador"></span> <button type="button" data-piso="11">Llamar</button></li>
    <li id="piso-10">Piso 10 <span class="marcador"></span> <button type="button" data-piso="10">Llamar</button></li>
    <li id="piso-9">Piso 9 <span class="marcador"></span> <button type="button" data-piso="9">Llamar</button></li>
    <li id="piso-8">Piso 8 <span class="marcador"></span> <button type="button" data-piso="8">Llamar</button></li>
    <li id="piso-7">Piso 7 <span class="marcador"></span> <button type="button" data-piso="7">Llamar</button></li>
    <li id="piso-6">Piso 6 <span class="marcador"></span> <button type="button" data-piso="6">Llamar</button></li>
    <li id="piso-5">Piso 5 <span class="marcador"></span> <button type="button" data-piso="5">Llamar</button></li>
    <li id="piso-4">Piso 4 <span class="marcador"></span> <button type="button" data-piso="4">Llamar</button></li>
    <li id="piso-3">Piso 3 <span class="marcador"></span> <button type="button" data-piso="3">Llamar</button></li>
    <li id="piso-2">Piso 2 <span class="marcador"></span> <button type="button" data-piso="2">Llamar</button></li>
    <li id="piso-1">Piso 1 <span class="marcador"></span> <button type="button" data-piso="1">Llamar</button></li>
  </ul>

  <div>
    <button type="button" id="btn-limpiar">Limpiar historial</button>
  </div>

  <h3>Historial de eventos</h3>
  <ul id="historial"></ul>

  <script src="js/ascensor.js"></script>
  <script src="js/vista.js"></script>
  <script src="js/controlador.js"></script>
</body>
</html>
